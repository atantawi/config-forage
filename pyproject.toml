[project]
name = "config-forage"
version = "0.1.0"
description = "BSA (biased sampling) search for BLIS serving configs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Asser Tantawi", email = "tantawi@us.ibm.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pyyaml>=6.0,<7",
    "optuna>=5,<6",
    "smac>=2.4,<3",
    "ConfigSpace>=1.2,<2",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",
]

[project.scripts]
cf-grid = "config_forage.bench.grid:main"
cf-bench = "config_forage.bench.run:main"
cf-analyze = "config_forage.bench.analyze:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config_forage"]

[tool.pytest.ini_options]
markers = ["blis: needs the real BLIS stack (BLIS_BIN etc. set); skipped otherwise"]
