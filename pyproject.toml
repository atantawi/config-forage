[project]
name = "config-forage"
version = "0.1.0"
description = "BSA (biased sampling) search for BLIS serving configs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Asser Tantawi", email = "tantawi@us.ibm.com" }]
requires-python = ">=3.12"
dependencies = ["numpy", "pyyaml", "optuna", "smac", "scipy", "matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config_forage"]
